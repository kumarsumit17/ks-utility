name: Kotlin app release (shared)

# The one release workflow of the KS-Suite Kotlin apps (ks-tv-launcher, ks-jaiplayer,
# ks-streamflix, ks-vault, ks-expense-manager). Each app calls it from its own
# .github/workflows/release.yml, pinned to a ks-utility tag, and says which platforms it has:
#
#   Android and Google TV   one APK (+ AAB) from `android-module`; Google TV apps use the same
#                           APK with a leanback entry, so they need nothing more.
#   macOS                   a .dmg from `mac-module` (Compose Desktop / jpackage), Apple silicon.
#   Windows                 an .msi from `windows-module`, x64.
#
# Two ways in:
#   Tag push (vMAJOR.MINOR.PATCH)  A release. The Android build must be signed with the four
#                                  KEYSTORE secrets and is verified before anything is published.
#                                  The GitHub Release is published by a separate job, only when
#                                  every platform built.
#   Manual run                     Never publishes. Builds every platform for testing; without the
#                                  signing secrets the APK is unsigned and named so.
#
# File names follow ks-utility's app-update rules (specs/app-update.md), so apps find their own
# updates: <app>-v<version>.apk, <app>-v<version>-macos-arm64.dmg, <app>-v<version>-windows-x64.msi.
# See specs/release-workflow.md.

on:
  workflow_call:
    inputs:
      app-name:
        description: "Repository name, used as the file-name prefix (e.g. ks-jaiplayer)."
        type: string
        required: true
      display-name:
        description: "The app's name as people see it (e.g. KS JaiPlayer)."
        type: string
        required: true
      android-module:
        description: "Gradle path of the Android application module (e.g. :app). Empty: no Android build."
        type: string
        default: ""
      mac-module:
        description: "Gradle path of the macOS Compose Desktop module (e.g. :desktop:mac). Empty: no macOS build."
        type: string
        default: ""
      windows-module:
        description: "Gradle path of the Windows Compose Desktop module (e.g. :desktop:windows). Empty: no Windows build."
        type: string
        default: ""
      test-tasks:
        description: "Gradle tasks run before the Android build (e.g. testDebugUnitTest, or :shared:allTests)."
        type: string
        default: "testDebugUnitTest"
      desktop-test-tasks:
        description: "Gradle tasks run on macOS and Windows before packaging. Empty: none."
        type: string
        default: ""
      node:
        description: "Set up Node (the ks-utility language-file tools need it)."
        type: boolean
        default: true
      require-main:
        description: "A tag release must point at a commit on main (the suite's release cycle)."
        type: boolean
        default: true
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false

# Read-only by default. Only the publish job asks for write access, which the caller must grant.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      name: ${{ steps.ver.outputs.name }}
      code: ${{ steps.ver.outputs.code }}
      release: ${{ steps.ver.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # A tag gives the version; a manual run uses the latest tag (or 0.0.0, a build from source)
      # and never publishes.
      - name: Derive the version
        id: ver
        env:
          REQUIRE_MAIN: ${{ inputs.require-main }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH."
              exit 1
            fi
            if [ "$REQUIRE_MAIN" = "true" ]; then
              git fetch --quiet origin main
              if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                echo "::error::The tagged commit is not on main. Merge to main first, then tag (specs/release-cycle.md)."
                exit 1
              fi
            fi
            release=true
          else
            tag="$(git describe --tags --abbrev=0 2> /dev/null || echo v0.0.0)"
            tag="${tag#v}"
            [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || tag="0.0.0"
            release=false
          fi
          IFS='.' read -r major minor patch <<< "$tag"
          if [ "$((10#$minor))" -ge 100 ] || [ "$((10#$patch))" -ge 100 ]; then
            echo "::error::MINOR and PATCH must stay below 100 (versionCode = MAJOR*10000 + MINOR*100 + PATCH)."
            exit 1
          fi
          {
            echo "name=$tag"
            echo "code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          echo "## ${{ inputs.display-name }} $tag ($([ "$release" = true ] && echo release || echo test build))" >> "$GITHUB_STEP_SUMMARY"

  android:
    name: Android and Google TV
    needs: version
    if: inputs.android-module != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
      verified: ${{ steps.verify.outputs.verified }}
    steps:
      # Before anything is compiled: a tag release with a missing secret stops here.
      # Only names are reported, never values.
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          missing=()
          [ -n "$KEYSTORE_BASE64" ] || missing+=("KEYSTORE_BASE64")
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=("KEYSTORE_PASSWORD")
          [ -n "$KEY_ALIAS" ] || missing+=("KEY_ALIAS")
          [ -n "$KEY_PASSWORD" ] || missing+=("KEY_PASSWORD")
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$RELEASE" = "true" ]; then
            echo "::error::Missing signing secrets: ${missing[*]}. A tag release must be signed, so nothing was built or published."
            echo "Missing signing secrets: \`${missing[*]}\`. Add them under Settings › Secrets and variables › Actions, then push a new tag." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing signing secrets: ${missing[*]}. This test build is UNSIGNED."
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      # The release scripts come from ks-utility at the exact commit of this workflow.
      - uses: actions/checkout@v7
        with:
          repository: kumarsumit17/ks-utility
          ref: ${{ github.job_workflow_sha }}
          path: .ks-utility-release
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.node
        with:
          node-version: "24"

      # v5 is the current MIT-licensed line.
      - uses: gradle/actions/setup-gradle@v5

      # The keystore goes into the runner's temp folder, readable by this user only, and is
      # opened once here so a wrong password or alias fails before the build.
      - name: Decode and check keystore
        id: keystore
        if: steps.signing.outputs.signed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/ks-signing"
          keystore="$RUNNER_TEMP/ks-signing/release.jks"
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore" 2> /dev/null || [ ! -s "$keystore" ]; then
            echo "::error::KEYSTORE_BASE64 is not a valid base64 keystore."
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The keystore could not be opened with KEYSTORE_PASSWORD, or it has no entry named KEY_ALIAS."
            exit 1
          fi
          cert_sha256="$(keytool -exportcert -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" 2> /dev/null | openssl dgst -sha256 -r | cut -d ' ' -f 1)"
          echo "path=$keystore" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$cert_sha256" >> "$GITHUB_OUTPUT"

      - name: Tests
        if: inputs.test-tasks != ''
        run: ./gradlew ${{ inputs.test-tasks }}

      - name: Build release APK and AAB
        env:
          SIGNING_STORE_FILE: ${{ steps.keystore.outputs.path }}
          SIGNING_STORE_PASSWORD: ${{ steps.signing.outputs.signed == 'true' && secrets.KEYSTORE_PASSWORD || '' }}
          SIGNING_KEY_ALIAS: ${{ steps.signing.outputs.signed == 'true' && secrets.KEY_ALIAS || '' }}
          SIGNING_KEY_PASSWORD: ${{ steps.signing.outputs.signed == 'true' && secrets.KEY_PASSWORD || '' }}
          MODULE: ${{ inputs.android-module }}
        run: |
          ./gradlew "$MODULE:assembleRelease" "$MODULE:bundleRelease" \
            "-PversionName=${{ needs.version.outputs.name }}" "-PversionCode=${{ needs.version.outputs.code }}"

      - name: Find the outputs
        id: out
        env:
          MODULE: ${{ inputs.android-module }}
        run: |
          dir="$(echo "${MODULE#:}" | tr ':' '/')"
          apk="$(find "$dir/build/outputs/apk/release" -name '*.apk' | sort | sed -n '1p')"
          aab="$(find "$dir/build/outputs/bundle/release" -name '*.aab' | sort | sed -n '1p')"
          [ -s "$apk" ] && [ -s "$aab" ] || { echo "::error::No release APK/AAB under $dir/build/outputs."; exit 1; }
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "aab=$aab" >> "$GITHUB_OUTPUT"

      # A finished Gradle build is not proof of signing: apksigner and jarsigner check both
      # files against the keystore's certificate.
      - name: Verify signatures
        id: verify
        if: steps.signing.outputs.signed == 'true'
        env:
          EXPECTED_CERT_SHA256: ${{ steps.keystore.outputs.cert_sha256 }}
        run: bash .ks-utility-release/.github/scripts/verify-release-signing.sh signed "${{ steps.out.outputs.apk }}" "${{ steps.out.outputs.aab }}" "$EXPECTED_CERT_SHA256"

      - name: Confirm the build is unsigned
        if: steps.signing.outputs.signed == 'false'
        run: bash .ks-utility-release/.github/scripts/verify-release-signing.sh unsigned "${{ steps.out.outputs.apk }}" "${{ steps.out.outputs.aab }}"

      - name: Collect
        env:
          BASE: ${{ inputs.app-name }}-v${{ needs.version.outputs.name }}
          SUFFIX: ${{ steps.signing.outputs.signed == 'true' && '' || '-UNSIGNED' }}
        run: |
          mkdir -p dist
          cp "${{ steps.out.outputs.apk }}" "dist/$BASE$SUFFIX.apk"
          cp "${{ steps.out.outputs.aab }}" "dist/$BASE$SUFFIX.aab"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Remove keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/ks-signing"

  mac:
    name: macOS
    needs: version
    if: inputs.mac-module != ''
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.node
        with:
          node-version: "24"
      - uses: gradle/actions/setup-gradle@v5
      - name: Tests
        if: inputs.desktop-test-tasks != ''
        run: ./gradlew ${{ inputs.desktop-test-tasks }}
      # Not signed with a Developer ID yet: the dmg is ad-hoc signed, and the first open needs
      # System Settings › Privacy & Security › Open Anyway.
      - name: Build the dmg
        env:
          MODULE: ${{ inputs.mac-module }}
        run: ./gradlew "$MODULE:packageReleaseDmg" "-PversionName=${{ needs.version.outputs.name }}" "-PversionCode=${{ needs.version.outputs.code }}"
      - name: Collect
        env:
          MODULE: ${{ inputs.mac-module }}
          NAME: ${{ inputs.app-name }}-v${{ needs.version.outputs.name }}-macos-arm64.dmg
        run: |
          dir="$(echo "${MODULE#:}" | tr ':' '/')"
          dmg="$(find "$dir/build/compose/binaries" -name '*.dmg' | sed -n '1p')"
          [ -s "$dmg" ] || { echo "::error::No dmg under $dir/build/compose/binaries."; exit 1; }
          mkdir -p dist && cp "$dmg" "dist/$NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows
    needs: version
    if: inputs.windows-module != ''
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.node
        with:
          node-version: "24"
      - uses: gradle/actions/setup-gradle@v5
      - name: Tests
        if: inputs.desktop-test-tasks != ''
        run: ./gradlew ${{ inputs.desktop-test-tasks }}
      # Not Authenticode-signed yet: SmartScreen warns on first run (More info › Run anyway).
      - name: Build the msi
        env:
          MODULE: ${{ inputs.windows-module }}
        run: ./gradlew "$MODULE:packageReleaseMsi" "-PversionName=${{ needs.version.outputs.name }}" "-PversionCode=${{ needs.version.outputs.code }}"
      - name: Collect
        env:
          MODULE: ${{ inputs.windows-module }}
          NAME: ${{ inputs.app-name }}-v${{ needs.version.outputs.name }}-windows-x64.msi
        run: |
          dir="$(echo "${MODULE#:}" | tr ':' '/')"
          msi="$(find "$dir/build/compose/binaries" -name '*.msi' | sed -n '1p')"
          [ -s "$msi" ] || { echo "::error::No msi under $dir/build/compose/binaries."; exit 1; }
          mkdir -p dist && cp "$msi" "dist/$NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # Publishing is its own job, so the write token never reaches a build. It runs only for a tag,
  # only when every platform the app has built, and only with a signed, verified APK.
  publish:
    name: Publish GitHub Release
    needs: [version, android, mac, windows]
    if: >-
      always() &&
      needs.version.outputs.release == 'true' &&
      needs.version.result == 'success' &&
      (needs.android.result == 'success' || (needs.android.result == 'skipped' && inputs.android-module == '')) &&
      (needs.mac.result == 'success' || (needs.mac.result == 'skipped' && inputs.mac-module == '')) &&
      (needs.windows.result == 'success' || (needs.windows.result == 'skipped' && inputs.windows-module == '')) &&
      (inputs.android-module == '' || (needs.android.outputs.signed == 'true' && needs.android.outputs.verified == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Check the files
        run: |
          ls -la dist
          if ls dist | grep -qi 'unsigned'; then
            echo "::error::An unsigned file reached the publish job."
            exit 1
          fi
          [ -n "$(ls -A dist)" ] || { echo "::error::Nothing to publish."; exit 1; }
          (cd dist && sha256sum -- * > SHA256SUMS.txt)

      # Third-party action holding a write token: pinned to the exact commit of v3.0.4.
      - name: Publish
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ inputs.display-name }} ${{ needs.version.outputs.name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: "true"
          files: dist/*
