name: Kotlin app release (shared)

# The one release workflow of the KS-Suite Kotlin apps (ks-tv-launcher, ks-jaiplayer,
# ks-streamflix, ks-vault, ks-expense-manager). Each app calls it from its own
# .github/workflows/release.yml, at @main (specs/release-workflow.md, "Which version an app calls"), and says which platforms it has:
#
#   Android                 the phone APK (+ AAB) from `android-module`. A TV-only app
#                           (ks-tv-launcher) builds its TV app here and sets nothing else.
#   Google TV               an app with a real TV version (a tv/google-tv application module)
#                           also sets `tv-module`: a separate TV APK (+ AAB), <app>-v<version>-google-tv.apk.
#   Google Play             with `play-build-type`, each AAB comes from that build type (no
#                           in-app updater), so it can be uploaded to Play as it is.
#   macOS                   a .dmg from `mac-module` (Compose Desktop / jpackage), Apple silicon;
#                           with `mac-intel` also an Intel one (-macos-x64.dmg).
#   Windows                 an .msi from `windows-module`, x64.
#
# Platforms with their own versions: a tag `<platform>-vMAJOR.MINOR.PATCH` (android, google-tv,
# mac, windows) builds and releases only that platform; a plain `vMAJOR.MINOR.PATCH` builds all.
# A platform release is not marked "latest", so `releases/latest` stays the last release of all
# platforms; apps with platform tags read the release list (specs/app-update.md, "Platform tags").
#
# Two ways in:
#   Tag push (vMAJOR.MINOR.PATCH)  A release. The Android build must be signed with the four
#                                  KEYSTORE secrets and is verified before anything is published.
#                                  The GitHub Release is published by a separate job, only when
#                                  every platform built.
#   Manual run (rehearsal)         Builds and checks everything exactly as a tag would, for the
#                                  version given, and never publishes or attests. Without the
#                                  signing secrets the APK is unsigned and named so.
#
# File names follow ks-utility's app-update rules (specs/app-update.md), so apps find their own
# updates: <app>-v<version>.apk, <app>-v<version>-google-tv.apk, <app>-v<version>-macos-arm64.dmg,
# <app>-v<version>-windows-x64.msi.
# See specs/release-workflow.md.

on:
  workflow_call:
    inputs:
      version:
        description: "Rehearsal only: the version to build, X.Y.Z (a manual run passes its input). A tag run ignores it."
        type: string
        default: ""
      app-name:
        description: "Repository name, used as the file-name prefix (e.g. ks-jaiplayer)."
        type: string
        required: true
      display-name:
        description: "The app's name as people see it (e.g. KS JaiPlayer)."
        type: string
        required: true
      platform:
        description: "Rehearsal only: which platform to build (all, android, google-tv, mac, windows), as a platform tag would. A tag run takes it from the tag."
        type: string
        default: "all"
      android-module:
        description: "Gradle path of the Android application module (e.g. :app). Empty: no Android build."
        type: string
        default: ""
      android-file-name:
        description: "Name of the APK and AAB without extension. Empty: <app-name>-v<version>. Only for an app whose installed copies look for an older fixed name (ks-tv-launcher: app-release)."
        type: string
        default: ""
      tv-module:
        description: "Gradle path of a separate Google TV application module (e.g. :tv:google-tv), built with the same keystore as android-module. Empty: no TV APK."
        type: string
        default: ""
      play-build-type:
        description: "Build type of the AAB, for Google Play (e.g. play: no in-app updater, no REQUEST_INSTALL_PACKAGES, which Play forbids). Empty: the AAB is the release build, like the APK."
        type: string
        default: ""
      mac-module:
        description: "Gradle path of the macOS Compose Desktop module (e.g. :desktop:mac). Empty: no macOS build."
        type: string
        default: ""
      mac-intel:
        description: "Also build an Intel (x64) dmg, <app>-v<version>-macos-x64.dmg, on GitHub's Intel macOS runner."
        type: boolean
        default: false
      windows-module:
        description: "Gradle path of the Windows Compose Desktop module (e.g. :desktop:windows). Empty: no Windows build."
        type: string
        default: ""
      test-tasks:
        description: "Gradle tasks run before the Android build (e.g. testDebugUnitTest, or :shared:allTests)."
        type: string
        default: "testDebugUnitTest"
      desktop-test-tasks:
        description: "Gradle tasks run on macOS and Windows before packaging. Empty: none."
        type: string
        default: ""
      node:
        description: "Set up Node (the ks-utility language-file tools need it)."
        type: boolean
        default: true
      require-main:
        description: "A tag release must point at a commit on main (the suite's release cycle)."
        type: boolean
        default: true
    secrets:
      KEYSTORE_BASE64:
        required: false
      KEYSTORE_PASSWORD:
        required: false
      KEY_ALIAS:
        required: false
      KEY_PASSWORD:
        required: false
      # The DEV build's own Android key (never the production ks-release key).
      DEV_KEYSTORE_BASE64:
        required: false
      DEV_KEYSTORE_PASSWORD:
        required: false
      DEV_KEY_ALIAS:
        required: false
      DEV_KEY_PASSWORD:
        required: false

# Read-only by default. Only the publish job asks for write access, which the caller must grant.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      name: ${{ steps.ver.outputs.name }}
      code: ${{ steps.ver.outputs.code }}
      release: ${{ steps.ver.outputs.release }}
      platform: ${{ steps.ver.outputs.platform }}
      phone: ${{ steps.ver.outputs.phone }}
      tv: ${{ steps.ver.outputs.tv }}
      mac: ${{ steps.ver.outputs.mac }}
      windows: ${{ steps.ver.outputs.windows }}
      ks_utility: ${{ steps.suite.outputs.ks_utility }}
      variant: ${{ steps.variant.outputs.variant }}
      dev_name: ${{ steps.variant.outputs.dev_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A tag gives the version; a manual run uses the latest tag (or 0.0.0, a build from source)
      # and never publishes.
      - name: Derive the version
        id: ver
        env:
          REQUIRE_MAIN: ${{ inputs.require-main }}
          REHEARSE: ${{ inputs.version }}
          REHEARSE_PLATFORM: ${{ inputs.platform }}
          ANDROID_MODULE: ${{ inputs.android-module }}
          TV_MODULE: ${{ inputs.tv-module }}
          MAC_MODULE: ${{ inputs.mac-module }}
          WINDOWS_MODULE: ${{ inputs.windows-module }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # vX.Y.Z (every platform) or <platform>-vX.Y.Z (that platform only).
            if [[ "$GITHUB_REF_NAME" =~ ^(android|google-tv|mac|windows)-v(.+)$ ]]; then
              platform="${BASH_REMATCH[1]}"
              tag="${BASH_REMATCH[2]}"
            else
              platform=all
              tag="${GITHUB_REF_NAME#v}"
            fi
            if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH or <platform>-vMAJOR.MINOR.PATCH."
              exit 1
            fi
            if [ "$REQUIRE_MAIN" = "true" ]; then
              git fetch --quiet origin main
              if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                echo "::error::The tagged commit is not on main. Merge to main first, then tag (specs/release-cycle.md)."
                exit 1
              fi
            fi
            release=true
          else
            tag="${REHEARSE#v}"
            if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::A rehearsal needs a version input X.Y.Z (got '$REHEARSE')."
              exit 1
            fi
            platform="${REHEARSE_PLATFORM:-all}"
            echo "::notice::Rehearsal of v$tag ($platform) on $GITHUB_REF_NAME: no attestation, no release."
            release=false
          fi
          case "$platform" in all|android|google-tv|mac|windows) ;; *)
            echo "::error::Unknown platform '$platform' (all, android, google-tv, mac, windows)."; exit 1 ;;
          esac
          # Which builds run: the app has the module, and the platform is this one (or all).
          want() { [ -n "$1" ] && { [ "$platform" = all ] || [ "$platform" = "$2" ]; } && echo true || echo false; }
          phone="$(want "$ANDROID_MODULE" android)"
          tv="$(want "$TV_MODULE" google-tv)"
          mac="$(want "$MAC_MODULE" mac)"
          windows="$(want "$WINDOWS_MODULE" windows)"
          if [ "$phone$tv$mac$windows" = falsefalsefalsefalse ]; then
            echo "::error::This app has no $platform build."
            exit 1
          fi
          IFS='.' read -r major minor patch <<< "$tag"
          if [ "$((10#$minor))" -ge 100 ] || [ "$((10#$patch))" -ge 100 ]; then
            echo "::error::MINOR and PATCH must stay below 100 (versionCode = MAJOR*10000 + MINOR*100 + PATCH)."
            exit 1
          fi
          {
            echo "name=$tag"
            echo "code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))"
            echo "release=$release"
            echo "platform=$platform"
            echo "phone=$phone"
            echo "tv=$tv"
            echo "mac=$mac"
            echo "windows=$windows"
          } >> "$GITHUB_OUTPUT"
          echo "## ${{ inputs.display-name }} $tag ($([ "$release" = true ] && echo release || echo test build))" >> "$GITHUB_STEP_SUMMARY"

      # A manual run is the DEV build (the suite's release cycle, "DEV and PROD side by side"):
      # the DEV variant (-PksVariant=dev), version X.Y.Z-dev+<commit>, the DEV Android key.
      - name: DEV or production
        id: variant
        env:
          NAME: ${{ steps.ver.outputs.name }}
          RELEASE: ${{ steps.ver.outputs.release }}
        run: |
          if [ "$RELEASE" = true ]; then echo "variant=prod"; else echo "variant=dev"; fi >> "$GITHUB_OUTPUT"
          echo "dev_name=$NAME-dev+${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # ks-suite-check (specs/suite-check.md): the suite rules that code can check, from
      # ks-utility's newest tag, which the app's pin must also be. A failure stops the release
      # and the rehearsal alike.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: ks-suite-check
        id: suite
        run: |
          # The ks-utility version the app is built on, for the release notes: the tag of the
          # submodule's commit (Kotlin), or the git tag in package.json and Cargo.toml (Tauri).
          if [ -n "$(git ls-tree HEAD ks-utility 2>/dev/null)" ]; then
            sha=$(git ls-tree HEAD ks-utility | awk '{print $3}')
            pin=$(git ls-remote --tags https://github.com/kumasumit/ks-utility.git | awk -v s="$sha" '$1 == s { sub("refs/tags/", "", $2); sub(/\^\{\}$/, "", $2); print $2 }' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
            [ -n "$pin" ] || pin="commit ${sha:0:7}"
          else
            pin=$(git ls-files '*package.json' '*Cargo.toml' | xargs grep -ho -E 'ks-utility(\.git#|.*tag *= *")v[0-9]+\.[0-9]+\.[0-9]+' 2>/dev/null | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | sort -u | tr '\n' ' ' | sed 's/ $//')
          fi
          # With the commit: "v0.18.4 (7dabd4a)".
          if [ -z "${sha:-}" ] && [ -n "$pin" ] && [ "${pin#* }" = "$pin" ]; then
            sha=$(git ls-remote --tags https://github.com/kumasumit/ks-utility.git "refs/tags/$pin^{}" | awk '{print $1}')
          fi
          [ -z "${sha:-}" ] || [ "${pin#commit }" != "$pin" ] || pin="$pin (${sha:0:7})"
          echo "ks_utility=${pin:-unknown}" >> "$GITHUB_OUTPUT"
          newest=$(git ls-remote --tags --refs https://github.com/kumasumit/ks-utility.git 'v*' | sed 's#.*refs/tags/##' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          [ -n "$newest" ] || { echo "::error::could not read ks-utility's tags"; exit 1; }
          git clone -q --depth 1 --branch "$newest" -c advice.detachedHead=false https://github.com/kumasumit/ks-utility.git "$RUNNER_TEMP/ks-utility-newest"
          node "$RUNNER_TEMP/ks-utility-newest/typescript/tools/suite-check.mjs" . --newest "$newest" --newest-commit "$(git -C "$RUNNER_TEMP/ks-utility-newest" rev-parse HEAD)" $([ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && echo --rehearsal)

  android:
    name: Android and Google TV
    needs: version
    if: needs.version.outputs.phone == 'true' || needs.version.outputs.tv == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
      verified: ${{ steps.verify.outputs.verified }}
    steps:
      # Before anything is compiled: a tag release with a missing secret stops here.
      # Only names are reported, never values.
      - name: Check signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ needs.version.outputs.release == 'true' && secrets.KEYSTORE_BASE64 || (needs.version.outputs.release != 'true' && secrets.DEV_KEYSTORE_BASE64 || '') }}
          KEYSTORE_PASSWORD: ${{ needs.version.outputs.release == 'true' && secrets.KEYSTORE_PASSWORD || (needs.version.outputs.release != 'true' && secrets.DEV_KEYSTORE_PASSWORD || '') }}
          KEY_ALIAS: ${{ needs.version.outputs.release == 'true' && secrets.KEY_ALIAS || (needs.version.outputs.release != 'true' && secrets.DEV_KEY_ALIAS || '') }}
          KEY_PASSWORD: ${{ needs.version.outputs.release == 'true' && secrets.KEY_PASSWORD || (needs.version.outputs.release != 'true' && secrets.DEV_KEY_PASSWORD || '') }}
          RELEASE: ${{ needs.version.outputs.release }}
        run: |
          # A release uses the production key; a DEV build (manual run) uses DEV_KEYSTORE_* only.
          p=""; [ "$RELEASE" = "true" ] || p="DEV_"
          missing=()
          [ -n "$KEYSTORE_BASE64" ] || missing+=("${p}KEYSTORE_BASE64")
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=("${p}KEYSTORE_PASSWORD")
          [ -n "$KEY_ALIAS" ] || missing+=("${p}KEY_ALIAS")
          [ -n "$KEY_PASSWORD" ] || missing+=("${p}KEY_PASSWORD")
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$RELEASE" = "true" ]; then
            echo "::error::Missing signing secrets: ${missing[*]}. A tag release must be signed, so nothing was built or published."
            echo "Missing signing secrets: \`${missing[*]}\`. Add them under Settings › Secrets and variables › Actions, then push a new tag." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "::error::Missing DEV signing secrets: ${missing[*]}. A DEV build is signed with its own key, never the production one, so nothing was built."
            echo "Missing DEV signing secrets: \`${missing[*]}\`. Add them under Settings › Secrets and variables › Actions (a keystore made for DEV builds only), then run the DEV build again." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false

      # The signing check lives in this workflow, so it is the same at every pinned tag and needs
      # nothing from another checkout. It proves whether the APK and AAB are signed.
      - name: Write the signing check
        run: |
          cat > "$RUNNER_TEMP/verify-release-signing.sh" <<'VERIFY_SCRIPT'
          #!/usr/bin/env bash
          # Proves whether a release APK and AAB are signed. A successful Gradle build is not proof:
          # with no usable keystore, Gradle quietly produces unsigned output.
          #
          #   verify-release-signing.sh signed   <apk> <aab> [expected-cert-sha256]
          #   verify-release-signing.sh unsigned <apk> <aab>
          #
          # signed:   both files must carry a valid signature from the same certificate. If an expected
          #           SHA-256 fingerprint is given (the one read from the keystore), both must match it.
          #           A debug certificate is rejected.
          # unsigned: both files must carry no signature at all, so a signed build can never be
          #           labelled unsigned (or the reverse).
          #
          # Prints certificate fingerprints, which are public. It never reads or prints key material.
          set -euo pipefail
          # With pipefail, never pipe a large variable into `grep -q` or `head`: they stop reading early,
          # the writer gets SIGPIPE and the check fails although it matched (v0.6.0's release run). Use
          # `grep -q PATTERN <<< "$var"`, and `sed -n '1p'` (reads everything) in place of `head -n 1`.

          mode="${1:-}"
          apk="${2:-}"
          aab="${3:-}"
          expected="${4:-}"

          fail() {
            echo "::error::$*"
            exit 1
          }

          # Lower-case hex without separators, so fingerprints from different tools compare equal.
          normalise() {
            tr -d ': \r\n' | tr 'A-F' 'a-f'
          }

          summary() {
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then echo "$*" >> "$GITHUB_STEP_SUMMARY"; fi
          }

          output() {
            if [ -n "${GITHUB_OUTPUT:-}" ]; then echo "$1=$2" >> "$GITHUB_OUTPUT"; fi
          }

          find_apksigner() {
            if [ -n "${APKSIGNER:-}" ]; then
              echo "$APKSIGNER"
              return
            fi
            if command -v apksigner > /dev/null 2>&1; then
              command -v apksigner
              return
            fi
            local sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
            [ -n "$sdk" ] || fail "apksigner not found: ANDROID_HOME is not set."
            local newest
            newest="$(find "$sdk/build-tools" -mindepth 2 -maxdepth 2 -name apksigner 2> /dev/null | sort -V | tail -n 1)"
            [ -n "$newest" ] || fail "apksigner not found under $sdk/build-tools."
            echo "$newest"
          }

          signature_entries() {
            unzip -Z1 "$1" | grep -E '^META-INF/[^/]+\.(RSA|DSA|EC|SF)$' || true
          }

          [ "$mode" = "signed" ] || [ "$mode" = "unsigned" ] || fail "First argument must be 'signed' or 'unsigned'."
          [ -s "$apk" ] || fail "APK is missing or empty: $apk"
          [ -s "$aab" ] || fail "AAB is missing or empty: $aab"
          command -v jarsigner > /dev/null 2>&1 || fail "jarsigner not found (it ships with the JDK)."
          command -v keytool > /dev/null 2>&1 || fail "keytool not found (it ships with the JDK)."

          apksigner="$(find_apksigner)"
          echo "Using apksigner: $apksigner"

          # ------------------------------------------------------------------ unsigned
          if [ "$mode" = "unsigned" ]; then
            if "$apksigner" verify "$apk" > /dev/null 2>&1; then
              fail "The APK is signed, but this build is labelled unsigned: $apk"
            fi
            echo "APK carries no valid signature, as expected."

            jar_report="$(jarsigner -verify "$aab" 2>&1 || true)"
            grep -q 'jar is unsigned' <<< "$jar_report" || fail "The AAB is not unsigned, but this build is labelled unsigned: $aab"
            [ -z "$(signature_entries "$aab")" ] || fail "The AAB contains signature files, but this build is labelled unsigned."
            echo "AAB carries no signature, as expected."

            output confirmed_unsigned true
            exit 0
          fi

          # -------------------------------------------------------------------- signed
          echo "::group::apksigner verify --verbose --print-certs"
          apk_report="$("$apksigner" verify --verbose --print-certs "$apk" 2>&1)" || {
            echo "$apk_report"
            echo "::endgroup::"
            fail "APK signature verification failed: $apk"
          }
          echo "$apk_report"
          echo "::endgroup::"

          grep -q '^Verifies' <<< "$apk_report" || fail "apksigner did not report 'Verifies' for $apk"
          apk_sha="$(grep -E 'certificate SHA-256 digest: ' <<< "$apk_report" | sed -n '1{s/.*digest: //;p;}' | normalise)"
          grep -Eq '^[0-9a-f]{64}$' <<< "$apk_sha" || fail "The APK has no signing certificate (no SHA-256 digest reported)."

          if grep -Eq 'certificate DN: .*CN=Android Debug' <<< "$apk_report"; then
            [ "${ALLOW_DEBUG_CERT:-}" = "true" ] || fail "The APK is signed with the Android debug certificate, not a release key."
            echo "::warning::APK is signed with the Android debug certificate (allowed for this local check only)."
          fi

          echo "::group::jarsigner -verify -verbose -certs"
          jar_report="$(jarsigner -verify -verbose -certs "$aab" 2>&1)" || {
            echo "$jar_report" | tail -n 40
            echo "::endgroup::"
            fail "AAB signature verification failed: $aab"
          }
          # The verbose listing has one block per file in the bundle, and newer JDKs add a per-entry
          # "signed in JarFile but is not signed in JarInputStream" note for bundles. Neither is the
          # verdict, so show the end of the report without those notes.
          echo "$jar_report" | grep -vE '^- Entry ' | tail -n 40
          echo "::endgroup::"

          # jarsigner exits 0 for an unsigned jar, so the verdict text is what counts.
          if grep -q 'jar is unsigned' <<< "$jar_report"; then fail "The AAB is unsigned: $aab"; fi
          grep -q '^jar verified' <<< "$jar_report" || fail "jarsigner did not report 'jar verified' for $aab"

          entries="$(signature_entries "$aab")"
          grep -Eq '\.SF$' <<< "$entries" || fail "The AAB has no signature file (META-INF/*.SF)."
          grep -Eq '\.(RSA|DSA|EC)$' <<< "$entries" || fail "The AAB has no signature block (META-INF/*.RSA, *.DSA or *.EC)."
          echo "AAB signature metadata:"
          echo "$entries" | sed 's/^/  /'

          aab_sha="$(keytool -printcert -jarfile "$aab" 2> /dev/null | grep -E 'SHA-?256:' | sed -n '1{s/.*SHA-\{0,1\}256: *//;p;}' | normalise)"
          grep -Eq '^[0-9a-f]{64}$' <<< "$aab_sha" || fail "Could not read the signing certificate from the AAB."

          echo "APK certificate SHA-256: $apk_sha"
          echo "AAB certificate SHA-256: $aab_sha"

          [ "$apk_sha" = "$aab_sha" ] || fail "The APK and the AAB are signed with different certificates."
          if [ -n "$expected" ]; then
            expected_sha="$(echo "$expected" | normalise)"
            [ "$apk_sha" = "$expected_sha" ] || fail "The artifacts are not signed with the certificate from the configured keystore."
            echo "Both match the certificate in the configured keystore."
          fi

          output verified true
          output cert_sha256 "$apk_sha"
          summary "- APK signature: verified with \`apksigner\`"
          summary "- AAB signature: verified with \`jarsigner\`"
          summary "- Signing certificate SHA-256: \`$apk_sha\`"
          echo "Signed build verified."
          VERIFY_SCRIPT

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.node
        with:
          node-version: "24"

      # v5 is the MIT-licensed line; v6 moves caching to a separately licensed component.
      # Patient downloads: one network error must not make Gradle drop Maven Central, the plugin
      # portal or the mirror for the rest of the build (then everything later is "not found").
      - name: Gradle network settings
        run: |
          d="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$d"
          cat >> "$d/gradle.properties" <<'PROPS'
          systemProp.org.gradle.internal.http.connectionTimeout=120000
          systemProp.org.gradle.internal.http.socketTimeout=120000
          systemProp.org.gradle.internal.repository.max.retries=6
          systemProp.org.gradle.internal.repository.initial.backoff=2000
          PROPS
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      # The keystore goes into the runner's temp folder, readable by this user only, and is
      # opened once here so a wrong password or alias fails before the build.
      - name: Decode and check keystore
        id: keystore
        if: steps.signing.outputs.signed == 'true'
        env:
          KEYSTORE_BASE64: ${{ needs.version.outputs.release == 'true' && secrets.KEYSTORE_BASE64 || (needs.version.outputs.release != 'true' && secrets.DEV_KEYSTORE_BASE64 || '') }}
          KEYSTORE_PASSWORD: ${{ needs.version.outputs.release == 'true' && secrets.KEYSTORE_PASSWORD || (needs.version.outputs.release != 'true' && secrets.DEV_KEYSTORE_PASSWORD || '') }}
          KEY_ALIAS: ${{ needs.version.outputs.release == 'true' && secrets.KEY_ALIAS || (needs.version.outputs.release != 'true' && secrets.DEV_KEY_ALIAS || '') }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/ks-signing"
          keystore="$RUNNER_TEMP/ks-signing/release.jks"
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore" 2> /dev/null || [ ! -s "$keystore" ]; then
            echo "::error::KEYSTORE_BASE64 is not a valid base64 keystore."
            exit 1
          fi
          if ! keytool -list -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The keystore could not be opened with KEYSTORE_PASSWORD, or it has no entry named KEY_ALIAS."
            exit 1
          fi
          cert_sha256="$(keytool -exportcert -keystore "$keystore" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" 2> /dev/null | openssl dgst -sha256 -r | cut -d ' ' -f 1)"
          echo "path=$keystore" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$cert_sha256" >> "$GITHUB_OUTPUT"

      - name: Tests
        if: inputs.test-tasks != ''
        run: ./gradlew ${{ inputs.test-tasks }}

      - name: Build release APK and AAB
        env:
          SIGNING_STORE_FILE: ${{ steps.keystore.outputs.path }}
          SIGNING_STORE_PASSWORD: ${{ steps.signing.outputs.signed == 'true' && (needs.version.outputs.release == 'true' && secrets.KEYSTORE_PASSWORD || (needs.version.outputs.release != 'true' && secrets.DEV_KEYSTORE_PASSWORD || '')) || '' }}
          SIGNING_KEY_ALIAS: ${{ steps.signing.outputs.signed == 'true' && (needs.version.outputs.release == 'true' && secrets.KEY_ALIAS || (needs.version.outputs.release != 'true' && secrets.DEV_KEY_ALIAS || '')) || '' }}
          SIGNING_KEY_PASSWORD: ${{ steps.signing.outputs.signed == 'true' && (needs.version.outputs.release == 'true' && secrets.KEY_PASSWORD || (needs.version.outputs.release != 'true' && secrets.DEV_KEY_PASSWORD || '')) || '' }}
          MODULE: ${{ needs.version.outputs.phone == 'true' && inputs.android-module || '' }}
          TV_MODULE: ${{ needs.version.outputs.tv == 'true' && inputs.tv-module || '' }}
          PLAY: ${{ inputs.play-build-type }}
        run: |
          # The APK is always the release build (GitHub, with the in-app updater); the AAB is the
          # Google Play build when play-build-type is set.
          bundle="bundle$(echo "${PLAY:-release}" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')"
          tasks=()
          [ -z "$MODULE" ] || tasks+=("$MODULE:assembleRelease" "$MODULE:$bundle")
          [ -z "$TV_MODULE" ] || tasks+=("$TV_MODULE:assembleRelease" "$TV_MODULE:$bundle")
          ./gradlew "${tasks[@]}" \
            "-PversionName=${{ needs.version.outputs.release == 'true' && needs.version.outputs.name || needs.version.outputs.dev_name }}" "-PversionCode=${{ needs.version.outputs.code }}" "-PksVariant=${{ needs.version.outputs.variant }}" "-PksDevVersion=${{ needs.version.outputs.dev_name }}"

      - name: Find the outputs
        id: out
        env:
          MODULE: ${{ needs.version.outputs.phone == 'true' && inputs.android-module || '' }}
          TV_MODULE: ${{ needs.version.outputs.tv == 'true' && inputs.tv-module || '' }}
          PLAY: ${{ inputs.play-build-type }}
        run: |
          find_outputs() { # <module> <output prefix>
            local dir apk aab
            dir="$(echo "${1#:}" | tr ':' '/')"
            apk="$(find "$dir/build/outputs/apk/release" -name '*.apk' | sort | sed -n '1p')"
            aab="$(find "$dir/build/outputs/bundle/${PLAY:-release}" -name '*.aab' | sort | sed -n '1p')"
            [ -s "$apk" ] && [ -s "$aab" ] || { echo "::error::No release APK/AAB under $dir/build/outputs."; exit 1; }
            echo "${2}apk=$apk" >> "$GITHUB_OUTPUT"
            echo "${2}aab=$aab" >> "$GITHUB_OUTPUT"
          }
          [ -z "$MODULE" ] || find_outputs "$MODULE" ""
          [ -z "$TV_MODULE" ] || find_outputs "$TV_MODULE" "tv_"

      # A finished Gradle build is not proof of signing: apksigner and jarsigner check both
      # files against the keystore's certificate.
      - name: Verify signatures
        id: verify
        if: steps.signing.outputs.signed == 'true'
        env:
          EXPECTED_CERT_SHA256: ${{ steps.keystore.outputs.cert_sha256 }}
          APK: ${{ steps.out.outputs.apk }}
          AAB: ${{ steps.out.outputs.aab }}
          TV_APK: ${{ steps.out.outputs.tv_apk }}
          TV_AAB: ${{ steps.out.outputs.tv_aab }}
        run: |
          [ -z "$APK" ] || bash "$RUNNER_TEMP/verify-release-signing.sh" signed "$APK" "$AAB" "$EXPECTED_CERT_SHA256"
          [ -z "$TV_APK" ] || bash "$RUNNER_TEMP/verify-release-signing.sh" signed "$TV_APK" "$TV_AAB" "$EXPECTED_CERT_SHA256"

      - name: Confirm the build is unsigned
        if: steps.signing.outputs.signed == 'false'
        env:
          APK: ${{ steps.out.outputs.apk }}
          AAB: ${{ steps.out.outputs.aab }}
          TV_APK: ${{ steps.out.outputs.tv_apk }}
          TV_AAB: ${{ steps.out.outputs.tv_aab }}
        run: |
          [ -z "$APK" ] || bash "$RUNNER_TEMP/verify-release-signing.sh" unsigned "$APK" "$AAB"
          [ -z "$TV_APK" ] || bash "$RUNNER_TEMP/verify-release-signing.sh" unsigned "$TV_APK" "$TV_AAB"

      - name: Collect
        env:
          BASE: ${{ inputs.android-file-name != '' && inputs.android-file-name || format('{0}-v{1}', inputs.app-name, needs.version.outputs.name) }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          APK: ${{ steps.out.outputs.apk }}
          AAB: ${{ steps.out.outputs.aab }}
          TV_APK: ${{ steps.out.outputs.tv_apk }}
          TV_AAB: ${{ steps.out.outputs.tv_aab }}
          VARIANT: ${{ needs.version.outputs.variant }}
          DEV_NAME: ${{ needs.version.outputs.dev_name }}
          APP: ${{ inputs.app-name }}
        run: |
          # Decided in the shell: in a GitHub expression `cond && '' || 'x'` is always 'x',
          # because an empty string counts as false.
          if [ "$SIGNED" = "true" ]; then SUFFIX=""; else SUFFIX="-UNSIGNED"; fi
          # A DEV build: <app>-dev-<version>-dev+<commit>-android.apk (and -google-tv).
          if [ "$VARIANT" = dev ]; then BASE="$APP-dev-$DEV_NAME"; PHONE_TAIL="-android"; else PHONE_TAIL=""; fi
          mkdir -p dist
          if [ -n "$APK" ]; then
            cp "$APK" "dist/$BASE$PHONE_TAIL$SUFFIX.apk"
            cp "$AAB" "dist/$BASE$PHONE_TAIL$SUFFIX.aab"
          fi
          if [ -n "$TV_APK" ]; then
            cp "$TV_APK" "dist/$BASE-google-tv$SUFFIX.apk"
            cp "$TV_AAB" "dist/$BASE-google-tv$SUFFIX.aab"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.version.outputs.release != 'true' && 'dev-' || '' }}android
          path: dist/
          if-no-files-found: error
          # A rehearsal is the DEV build the owner tests by hand: named dev-…, kept 14 days.
          retention-days: ${{ needs.version.outputs.release == 'true' && 30 || 14 }}

      - name: Remove keystore
        if: always()
        run: rm -rf "$RUNNER_TEMP/ks-signing"

  mac:
    name: macOS ${{ matrix.arch }}
    needs: version
    if: needs.version.outputs.mac == 'true'
    strategy:
      fail-fast: true
      matrix:
        arch: ${{ fromJSON(inputs.mac-intel && '["arm64","x64"]' || '["arm64"]') }}
    # Each dmg is built on its own architecture: jpackage packages the JDK it runs on.
    runs-on: ${{ matrix.arch == 'x64' && 'macos-15-intel' || 'macos-15' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.node
        with:
          node-version: "24"
      # Patient downloads: one network error must not make Gradle drop Maven Central, the plugin
      # portal or the mirror for the rest of the build (then everything later is "not found").
      - name: Gradle network settings
        run: |
          d="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$d"
          cat >> "$d/gradle.properties" <<'PROPS'
          systemProp.org.gradle.internal.http.connectionTimeout=120000
          systemProp.org.gradle.internal.http.socketTimeout=120000
          systemProp.org.gradle.internal.repository.max.retries=6
          systemProp.org.gradle.internal.repository.initial.backoff=2000
          PROPS
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Tests
        if: inputs.desktop-test-tasks != ''
        run: ./gradlew ${{ inputs.desktop-test-tasks }}
      # Not signed with a Developer ID yet: the dmg is ad-hoc signed, and the first open needs
      # System Settings › Privacy & Security › Open Anyway.
      - name: Build the dmg
        env:
          MODULE: ${{ inputs.mac-module }}
        run: ./gradlew "$MODULE:packageReleaseDmg" "-PversionName=${{ needs.version.outputs.name }}" "-PversionCode=${{ needs.version.outputs.code }}" "-PksVariant=${{ needs.version.outputs.variant }}" "-PksDevVersion=${{ needs.version.outputs.dev_name }}"
      - name: Collect
        env:
          MODULE: ${{ inputs.mac-module }}
          NAME: ${{ needs.version.outputs.variant == 'dev' && format('{0}-dev-{1}', inputs.app-name, needs.version.outputs.dev_name) || format('{0}-v{1}', inputs.app-name, needs.version.outputs.name) }}-macos-${{ matrix.arch }}.dmg
        run: |
          dir="$(echo "${MODULE#:}" | tr ':' '/')"
          dmg="$(find "$dir/build/compose/binaries" -name '*.dmg' | sed -n '1p')"
          [ -s "$dmg" ] || { echo "::error::No dmg under $dir/build/compose/binaries."; exit 1; }
          mkdir -p dist && cp "$dmg" "dist/$NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.version.outputs.release != 'true' && 'dev-' || '' }}macos-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error
          # A rehearsal is the DEV build the owner tests by hand: named dev-…, kept 14 days.
          retention-days: ${{ needs.version.outputs.release == 'true' && 30 || 14 }}

  windows:
    name: Windows
    needs: version
    if: needs.version.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.node
        with:
          node-version: "24"
      # Patient downloads: one network error must not make Gradle drop Maven Central, the plugin
      # portal or the mirror for the rest of the build (then everything later is "not found").
      - name: Gradle network settings
        run: |
          d="${GRADLE_USER_HOME:-$HOME/.gradle}"
          mkdir -p "$d"
          cat >> "$d/gradle.properties" <<'PROPS'
          systemProp.org.gradle.internal.http.connectionTimeout=120000
          systemProp.org.gradle.internal.http.socketTimeout=120000
          systemProp.org.gradle.internal.repository.max.retries=6
          systemProp.org.gradle.internal.repository.initial.backoff=2000
          PROPS
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      - name: Tests
        if: inputs.desktop-test-tasks != ''
        run: ./gradlew ${{ inputs.desktop-test-tasks }}
      # Not Authenticode-signed yet: SmartScreen warns on first run (More info › Run anyway).
      - name: Build the msi
        env:
          MODULE: ${{ inputs.windows-module }}
        run: ./gradlew "$MODULE:packageReleaseMsi" "-PversionName=${{ needs.version.outputs.name }}" "-PversionCode=${{ needs.version.outputs.code }}" "-PksVariant=${{ needs.version.outputs.variant }}" "-PksDevVersion=${{ needs.version.outputs.dev_name }}"
      - name: Collect
        env:
          MODULE: ${{ inputs.windows-module }}
          NAME: ${{ needs.version.outputs.variant == 'dev' && format('{0}-dev-{1}', inputs.app-name, needs.version.outputs.dev_name) || format('{0}-v{1}', inputs.app-name, needs.version.outputs.name) }}-windows-x64.msi
        run: |
          dir="$(echo "${MODULE#:}" | tr ':' '/')"
          msi="$(find "$dir/build/compose/binaries" -name '*.msi' | sed -n '1p')"
          [ -s "$msi" ] || { echo "::error::No msi under $dir/build/compose/binaries."; exit 1; }
          mkdir -p dist && cp "$msi" "dist/$NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.version.outputs.release != 'true' && 'dev-' || '' }}windows
          path: dist/
          if-no-files-found: error
          # A rehearsal is the DEV build the owner tests by hand: named dev-…, kept 14 days.
          retention-days: ${{ needs.version.outputs.release == 'true' && 30 || 14 }}

  # Publishing is its own job, so the write token never reaches a build. It runs only for a tag,
  # only when every platform the app has built, and only with a signed, verified APK. It checks it
  # got exactly the expected files, attests each one (build provenance), and publishes them with
  # the preinstalled gh CLI: the release becomes public only once every file is up.
  publish:
    name: Attest and publish
    needs: [version, android, mac, windows]
    if: >-
      !cancelled() &&
      needs.version.outputs.release == 'true' &&
      needs.version.result == 'success' &&
      (needs.android.result == 'success' || (needs.android.result == 'skipped' && needs.version.outputs.phone != 'true' && needs.version.outputs.tv != 'true')) &&
      (needs.mac.result == 'success' || (needs.mac.result == 'skipped' && needs.version.outputs.mac != 'true')) &&
      (needs.windows.result == 'success' || (needs.windows.result == 'skipped' && needs.version.outputs.windows != 'true')) &&
      ((needs.version.outputs.phone != 'true' && needs.version.outputs.tv != 'true') || (needs.android.outputs.signed == 'true' && needs.android.outputs.verified == 'true'))
    runs-on: ubuntu-24.04
    # The owner's approval: with the environment "production" set up in the app's repository
    # (the owner as required reviewer), every release waits here for that click, before anything
    # is attested or published (the suite's release cycle, "DEV, test, approval, production").
    environment: production
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Exactly the expected files
        env:
          BASE: ${{ inputs.app-name }}-v${{ needs.version.outputs.name }}
          APK_BASE: ${{ inputs.android-file-name != '' && inputs.android-file-name || format('{0}-v{1}', inputs.app-name, needs.version.outputs.name) }}
          PHONE: ${{ needs.version.outputs.phone }}
          TV: ${{ needs.version.outputs.tv }}
          MAC: ${{ needs.version.outputs.mac }}
          MAC_INTEL: ${{ inputs.mac-intel }}
          WINDOWS: ${{ needs.version.outputs.windows }}
        run: |
          expected=()
          [ "$PHONE" != true ] || expected+=("$APK_BASE.apk" "$APK_BASE.aab")
          [ "$TV" != true ] || expected+=("$APK_BASE-google-tv.apk" "$APK_BASE-google-tv.aab")
          [ "$MAC" != true ] || expected+=("$BASE-macos-arm64.dmg")
          [ "$MAC" != true ] || [ "$MAC_INTEL" != true ] || expected+=("$BASE-macos-x64.dmg")
          [ "$WINDOWS" != true ] || expected+=("$BASE-windows-x64.msi")
          got="$(cd dist && ls -1 | sort)"
          want="$(printf '%s\n' "${expected[@]}" | sort)"
          if [ "$got" != "$want" ]; then
            echo "::error::Release files differ from the expected list."
            echo "Expected:"; echo "$want"; echo "Got:"; echo "$got"
            exit 1
          fi
          for f in "${expected[@]}"; do [ -s "dist/$f" ] || { echo "::error::$f is empty."; exit 1; }; done

      - name: SHA256SUMS
        run: (cd dist && sha256sum $(ls | LC_ALL=C sort) > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          NAME: ${{ inputs.display-name }}
          VERSION: ${{ needs.version.outputs.name }}
          PLATFORM: ${{ needs.version.outputs.platform }}
          KS_UTILITY: ${{ needs.version.outputs.ks_utility }}
          ANDROID: ${{ needs.version.outputs.phone == 'true' || needs.version.outputs.tv == 'true' }}
          MAC: ${{ needs.version.outputs.mac }}
          WINDOWS: ${{ needs.version.outputs.windows }}
        run: |
          {
            echo "Built on ks-utility $KS_UTILITY."
            echo
            [ "$ANDROID" != true ] || echo "- Android: signed with the suite's key, signature verified before publishing."
            [ "$MAC" != true ] || echo "- macOS: not signed with an Apple Developer ID (open it with right-click, Open, the first time)."
            [ "$WINDOWS" != true ] || echo "- Windows: not code-signed (SmartScreen may ask once)."
            echo "- SHA256SUMS lists the SHA-256 of every file; each file also has a build-provenance attestation."
          } > notes.md
          cat notes.md
          # A platform's own release names its platform and is not "latest" (releases/latest stays
          # the last release of all platforms, which apps without platform tags read).
          case "$PLATFORM" in
            all) title="$NAME $VERSION"; latest=--latest ;;
            android) title="$NAME for Android $VERSION"; latest=--latest=false ;;
            google-tv) title="$NAME for Google TV $VERSION"; latest=--latest=false ;;
            mac) title="$NAME for macOS $VERSION"; latest=--latest=false ;;
            windows) title="$NAME for Windows $VERSION"; latest=--latest=false ;;
          esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag "$latest" --notes-file notes.md --generate-notes --title "$title" dist/*
          [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = false ] || { echo "::error::The release was not published."; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
